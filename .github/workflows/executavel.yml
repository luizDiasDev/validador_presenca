name: Executável de sala

on:
  push:
    branches: [main]
    paths:
      - "class_client/**"
      - ".github/workflows/executavel.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: class_client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: class_client/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Rodar os testes
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Gerar o executável
        run: ./build_exe.ps1

      - name: Compactar
        run: Compress-Archive -Path dist/ADSUM-Sala -DestinationPath ADSUM-Sala.zip -Force

      - name: Publicar na Release "executavel"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view executavel > /dev/null 2>&1 || gh release create executavel \
            --title "Executável de sala" --latest=false \
            --notes "Gerado automaticamente a cada atualização do class_client. O link de download não muda."
          gh release upload executavel ADSUM-Sala.zip --clobber
