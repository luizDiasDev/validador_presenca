name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: validador_presenca
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências
        run: pip install -r ../requirements.txt
      - name: Testes unitários
        run: pytest -m "not integration"

  integration-tests:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: validador_presenca
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências
        run: pip install -r ../requirements.txt
      - name: Testes de integração
        run: pytest -m integration

  lint:
    name: Linter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar Ruff
        run: pip install ruff==0.17.4
      - name: Linter
        run: ruff check validador_presenca
